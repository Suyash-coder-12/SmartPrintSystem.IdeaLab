<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Print</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            width: 100%;
            max-width: 420px;
            margin: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .role-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.05);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        
        body.dark-theme .role-selector {
            background: rgba(255, 255, 255, 0.05);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .forgot-password {
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            margin-top: -10px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .theme-toggle-fixed {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10;
        }

        /* Mobile Responsiveness for Login */
        @media (max-width: 480px) {
            .login-container {
                padding: 24px;
                max-width: 90%;
            }
            .theme-toggle-fixed {
                top: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle glass-panel theme-toggle-fixed" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <!-- Login Card -->
    <div class="glass-panel login-container">
        <div class="logo" style="justify-content: center; margin-bottom: 0;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9V2h12v7"/>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                <path d="M6 14h12v8H6z"/>
            </svg>
            <h1 style="font-size: 28px;">Smart Print</h1>
        </div>

        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please log in to your account</p>
        </div>

        <div class="role-selector">
            <button class="role-btn active" data-role="xerox">Xerox Center</button>
            <button class="role-btn" data-role="admin">SuperAdmin</button>
        </div>

        <form id="loginForm" class="login-form">
            <div class="setting-group">
                <label>Email Address</label>
                <input type="email" id="email" class="glass-input" placeholder="you@example.com" required>
            </div>
            <div class="setting-group">
                <label>Password</label>
                <input type="password" id="password" class="glass-input" placeholder="••••••••" required>
            </div>
            <a href="#" class="forgot-password">Forgot password?</a>
            
            <button type="submit" class="btn-primary" style="margin-top: 10px; width: 100%;">
                Sign In
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            </button>
        </form>

        <p style="text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 10px;">
            Don't have a Xerox Center account? <a href="#" style="color: var(--primary); font-weight: 600; text-decoration: none;">Apply Now</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
